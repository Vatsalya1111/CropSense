<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Background Soft Green Atmosphere -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Soft Sunlight Flare -->
  <circle cx="650" cy="80" r="140" fill="#fef08a" opacity="0.18" filter="blur(30px)" />
  <circle cx="650" cy="80" r="60" fill="#ffffff" opacity="0.25" filter="blur(15px)" />

  <!-- Out of focus background plants -->
  <g opacity="0.3" filter="blur(6px)">
    <path d="M 200,500 Q 220,300 240,150" stroke="#4ade80" stroke-width="12" fill="none" />
    <path d="M 550,500 Q 530,280 500,120" stroke="#86efac" stroke-width="14" fill="none" />
  </g>

  <!-- Main Center Wheat Stalk (Close-up) -->
  <!-- Stem -->
  <path d="M 380,500 Q 400,320 400,160" stroke="#eab308" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Wheat Spikelets / Grains -->
  <g fill="url(#wheatGold)" stroke="#a16207" stroke-width="1.5">
    <!-- Row Left -->
    <ellipse cx="372" cy="180" rx="14" ry="24" transform="rotate(-35 372 180)" />
    <line x1="360" y1="170" x2="310" y2="110" stroke="#facc15" stroke-width="2" />

    <ellipse cx="368" cy="220" rx="15" ry="26" transform="rotate(-30 368 220)" />
    <line x1="355" y1="210" x2="300" y2="160" stroke="#facc15" stroke-width="2" />

    <ellipse cx="366" cy="260" rx="16" ry="28" transform="rotate(-25 366 260)" />
    <line x1="350" y1="250" x2="295" y2="210" stroke="#facc15" stroke-width="2" />

    <ellipse cx="364" cy="300" rx="16" ry="28" transform="rotate(-20 364 300)" />
    <line x1="350" y1="290" x2="300" y2="260" stroke="#facc15" stroke-width="2" />

    <!-- Row Right -->
    <ellipse cx="426" cy="195" rx="14" ry="24" transform="rotate(35 426 195)" />
    <line x1="438" y1="185" x2="490" y2="120" stroke="#facc15" stroke-width="2" />

    <ellipse cx="430" cy="235" rx="15" ry="26" transform="rotate(30 430 235)" />
    <line x1="442" y1="225" x2="500" y2="170" stroke="#facc15" stroke-width="2" />

    <ellipse cx="432" cy="275" rx="16" ry="28" transform="rotate(25 432 275)" />
    <line x1="445" y1="265" x2="505" y2="220" stroke="#facc15" stroke-width="2" />

    <ellipse cx="434" cy="315" rx="16" ry="28" transform="rotate(20 434 315)" />
    <line x1="448" y1="305" x2="500" y2="270" stroke="#facc15" stroke-width="2" />

    <!-- Tip Grain -->
    <ellipse cx="399" cy="150" rx="12" ry="22" transform="rotate(5 399 150)" fill="#fef08a" />
    <line x1="399" y1="140" x2="400" y2="60" stroke="#fde047" stroke-width="2" />
  </g>

  <!-- Green Healthy Leaves Framing -->
  <path d="M 390,380 Q 280,340 180,410 Q 290,370 385,420 Z" fill="url(#leafGrad)" opacity="0.9" />
  <path d="M 405,360 Q 520,310 640,360 Q 510,350 405,400 Z" fill="url(#leafGrad)" opacity="0.9" />

  <!-- Botanical Sunlight Glow on Tips -->
  <circle cx="399" cy="150" r="16" fill="#ffffff" opacity="0.3" filter="blur(6px)" />
</svg>
