<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="advSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background Agro Forest/Field Backdrop -->
  <rect width="800" height="450" fill="url(#advSky)" />

  <!-- Soft Ambient Field Light -->
  <circle cx="400" cy="180" r="180" fill="#22c55e" opacity="0.15" filter="blur(40px)" />

  <!-- Decorative Field Rows in Backdrop -->
  <path d="M 0,380 Q 400,340 800,370 L 800,450 L 0,450 Z" fill="#0f391b" />

  <!-- Center Advisory Clipboard / Agronomy Inspection Card Visual -->
  <g transform="translate(260, 60)">
    <!-- Clipboard Board -->
    <rect x="0" y="20" width="280" height="340" rx="20" fill="#78350f" stroke="#451a03" stroke-width="4" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.35))" />

    <!-- Clip Top Metal -->
    <rect x="90" y="6" width="100" height="30" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="3" />
    <circle cx="140" cy="20" r="6" fill="#475569" />

    <!-- Sheet Paper -->
    <rect x="20" y="45" width="240" height="295" rx="10" fill="#ffffff" />

    <!-- Header Green Bar -->
    <rect x="35" y="65" width="210" height="30" rx="6" fill="#dcfce7" />
    <text x="50" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">FIELD ADVISORY</text>

    <!-- Checklist Items with Green Checkmarks -->
    <!-- Item 1 -->
    <circle cx="50" cy="125" r="10" fill="#22c55e" />
    <path d="M 46,125 L 49,128 L 55,121" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="70" y="118" width="150" height="8" rx="4" fill="#cbd5e1" />
    <rect x="70" y="132" width="100" height="6" rx="3" fill="#e2e8f0" />

    <!-- Item 2 -->
    <circle cx="50" cy="165" r="10" fill="#22c55e" />
    <path d="M 46,165 L 49,168 L 55,161" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="70" y="158" width="165" height="8" rx="4" fill="#cbd5e1" />
    <rect x="70" y="172" width="120" height="6" rx="3" fill="#e2e8f0" />

    <!-- Item 3 -->
    <circle cx="50" cy="205" r="10" fill="#eab308" />
    <path d="M 50,199 L 50,205" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="50" cy="210" r="1.5" fill="#ffffff" />
    <rect x="70" y="198" width="140" height="8" rx="4" fill="#cbd5e1" />
    <rect x="70" y="212" width="90" height="6" rx="3" fill="#e2e8f0" />

    <!-- Sprout Logo Stamp on Sheet -->
    <circle cx="140" cy="280" r="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
    <path d="M 140,292 Q 140,270 140,266 Q 148,260 154,264 Q 152,274 140,274 Z" fill="#16a34a" />
    <path d="M 140,274 Q 130,266 126,270 Q 128,280 140,280 Z" fill="#22c55e" />
  </g>

  <!-- Left & Right Wheat Silhouette framing -->
  <path d="M 80,450 Q 120,320 150,220" stroke="#ca8a04" stroke-width="5" fill="none" opacity="0.6" />
  <path d="M 720,450 Q 680,320 650,210" stroke="#ca8a04" stroke-width="5" fill="none" opacity="0.6" />
</svg>
