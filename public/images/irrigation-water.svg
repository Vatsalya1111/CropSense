<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="waterSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="moistSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="40%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Sky / Field Horizon -->
  <rect width="800" height="230" fill="url(#waterSky)" />

  <!-- Moist Fertile Soil Base -->
  <path d="M 0,220 Q 200,205 400,215 T 800,220 L 800,450 L 0,450 Z" fill="url(#moistSoil)" />

  <!-- Irrigation Pipe / Drip Line -->
  <path d="M 0,290 C 250,285 550,295 800,290" stroke="#1c1917" stroke-width="14" fill="none" />
  <path d="M 0,288 C 250,283 550,293 800,288" stroke="#44403c" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Soil Moisture Rings around drip emitters -->
  <ellipse cx="200" cy="310" rx="90" ry="24" fill="#1c1917" opacity="0.6" />
  <ellipse cx="420" cy="315" rx="100" ry="26" fill="#1c1917" opacity="0.6" />
  <ellipse cx="640" cy="310" rx="90" ry="24" fill="#1c1917" opacity="0.6" />

  <!-- Drip Emitter Water Drops -->
  <g fill="url(#dropGrad)">
    <!-- Droplet 1 -->
    <path d="M 200,270 C 190,290 185,305 200,312 C 215,305 210,290 200,270 Z" />
    <circle cx="196" cy="302" r="3" fill="#ffffff" opacity="0.8" />

    <!-- Droplet 2 In Flight -->
    <path d="M 420,250 C 405,275 400,295 420,305 C 440,295 435,275 420,250 Z" />
    <circle cx="415" cy="292" r="4" fill="#ffffff" opacity="0.8" />

    <!-- Droplet 3 -->
    <path d="M 640,270 C 630,290 625,305 640,312 C 655,305 650,290 640,270 Z" />
    <circle cx="636" cy="302" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Growing Green Sprouts Benefiting From Water -->
  <g fill="#22c55e">
    <path d="M 230,285 Q 260,255 280,265 Q 260,275 230,290 Z" />
    <path d="M 230,285 Q 200,255 180,265 Q 200,275 230,290 Z" />

    <path d="M 450,290 Q 480,255 500,265 Q 480,278 450,295 Z" />
    <path d="M 450,290 Q 420,255 400,265 Q 420,278 450,295 Z" />

    <path d="M 670,285 Q 700,255 720,265 Q 700,275 670,290 Z" />
  </g>
</svg>
